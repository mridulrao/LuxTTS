services:
  luxtts-ws-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: luxtts-ws-gpu
    ports:
      - "8765:8765"
    volumes:
      - ./voices:/voices
      - ./.cache/huggingface:/models/huggingface
      - ./.cache/torch:/models/torch
    gpus: all
    command:
      - python
      - -m
      - zipvoice.ws_tts_server
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --device
      - cuda
      - --reference-dir
      - /voices
      - --prompt-audio
      - voice_sample_female.mp3
      - --prewarm
    restart: unless-stopped
